# ────────── Local MySQL ──────────
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_DB_HOST:localhost}:${MYSQL_DB_PORT:3330}/${MYSQL_DB_NAME:home_risk_check}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_DB_USERNAME}
spring.datasource.password=${MYSQL_DB_PASSWORD}

# ────────── Local Redis ──────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ────────── JPA ──────────
# 로컬은 엔티티 변경을 자동 반영 (개발 편의)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ────────── 로깅 (디버깅 친화) ──────────
logging.level.root=INFO
logging.level.hanshin.home_risk_check=DEBUG
logging.level.org.hibernate.SQL=DEBUG