# ────────── Prod MySQL ──────────
# 운영은 env 강제 (default 없음 — 누락 시 부팅 실패로 조기 감지)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_DB_HOST}:${MYSQL_DB_PORT}/${MYSQL_DB_NAME}?serverTimezone=UTC
spring.datasource.username=${MYSQL_DB_USERNAME}
spring.datasource.password=${MYSQL_DB_PASSWORD}

# ────────── Prod Redis ──────────
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# ────────── JPA ──────────
# 운영은 스키마 자동 변경 금지 (마이그레이션 도구로 관리)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ────────── 로깅 ──────────
logging.level.root=WARN
logging.level.hanshin.home_risk_check=INFO

# 파일 출력 (일별 롤링, 14일 보관, 파일당 10MB 초과 시 새 파일)
logging.file.name=logs/app.log
logging.logback.rollingpolicy.file-name-pattern=logs/app-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.max-file-size=10MB

# ────────── JWT 키 ──────────
# 운영은 JAR 내부에 키를 두지 않음 — 외부 디스크 경로에서 주입
jwt.private-key=file:${JWT_KEY_PATH}/privatekey.pem
jwt.public-key=file:${JWT_KEY_PATH}/publickey.pem

# ────────── Actuator (헬스체크용 최소 노출) ──────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never