spring.application.name=home-risk-check

# ────────── 서버 / 프로필 ──────────
server.port=${SPRING_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ────────── JPA 공통 ──────────
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.data.web.pageable.max-page-size=50

# ────────── 파일 업로드 ──────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ────────── JWT ──────────
# 로컬: classpath 기본값 사용. 운영: JWT_PRIVATE_KEY_PATH / JWT_PUBLIC_KEY_PATH 로 외부 경로 주입
jwt.private-key=${JWT_PRIVATE_KEY_PATH:classpath:keys/privatekey.pem}
jwt.public-key=${JWT_PUBLIC_KEY_PATH:classpath:keys/publickey.pem}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# ────────── Security ──────────
security.bcrypt.strength=${BCRYPT_STRENGTH:12}

# ────────── CORS ──────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin
cors.allow-credentials=true
cors.max-age=3600

# ────────── 외부 API ──────────
public-data.service-key=${PUBLIC_DATA_SERVICE_KEY:}
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
taas.api-key=${TAAS_API_KEY:}

# ────────── 파일 저장소 (AWS S3) ──────────
aws.s3.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.upload-prefix=${AWS_S3_UPLOAD_PREFIX:images}
file.base-url=${FILE_BASE_URL:}

# ────────── 안전 점수 가중치 ──────────
safetyscore.radius=500.0
safetyscore.hotspot-weight=4.5
safetyscore.density-weight=5.0
safetyscore.police-score=5.0
safetyscore.fire-score=2.0
safetyscore.macro-weights.infra=0.2
safetyscore.macro-weights.crime=0.5
safetyscore.macro-weights.accident=0.3