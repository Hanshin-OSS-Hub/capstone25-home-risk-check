spring.application.name=home-risk-check

server.port=${SPRING_PORT:8080}
spring.profiles.active=local

# JPA
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# \uD30C\uC77C \uC5C5\uB85C\uB4DC \uC124\uC815
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# jwt
jwt.private-key=classpath:keys/privatekey.pem
jwt.public-key=classpath:keys/publickey.pem

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin
cors.allow-credentials=true
cors.max-age=3600

# Security
security.bcrypt.strength=${BCRYPT_STRENGTH:12}

# \uC548\uC804 \uC810\uC218 \uAC00\uC911\uCE58 \uC124\uC815
safetyscore.radius=500.0
safetyscore.hotspot-weight=4.5
safetyscore.density-weight=5.0
safetyscore.police-score=5.0
safetyscore.fire-score=2.0
safetyscore.weights.cctv=0.2
safetyscore.weights.police=0.5
safetyscore.weights.lighting=0.3

spring.data.web.pageable.max-page-size=50
